
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f3f7f6;
            color: #183b39;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            color: #176e69;
        }

        .logout {
            background: #333;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            text-decoration: none;
        }

        .card {
            background: white;
            padding: 22px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 3px 15px #0000000b;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccd8d5;
            border-radius: 7px;
            font: inherit;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            border: 0;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            color: white;
            background: #176e69;
            font-weight: bold;
        }

        button:hover {
            background: #125a56;
        }

        .delete {
            background: #c0392b;
        }

        .delete:hover {
            background: #922b21;
        }

        .faq {
            border-top: 1px solid #e3eae8;
            padding: 18px 0;
        }

        .faq form {
            margin-top: 12px;
        }

        .message {
            background: #e3f5ed;
            padding: 12px;
            border-radius: 7px;
        }

        .filter-section {
            margin: 20px 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <div>
            <h1>Student Assistant</h1>
            <p>FAQ Management Dashboard</p>
        </div>

        <a class="logout" href="{{ url_for('admin_logout') }}">
            Logout
        </a>
    </header>

    {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <!-- ADD NEW FAQ -->
    <section class="card">
        <h2>Add New FAQ</h2>

        <form method="POST" action="{{ url_for('admin_add') }}">

            <label>Question</label>
            <input
                type="text"
                name="question"
                placeholder="Enter the student question"
                required
            >

            <label>Answer</label>
            <textarea
                name="answer"
                placeholder="Enter the verified answer"
                required
            ></textarea>

            <label>Category</label>
            <input
                type="text"
                name="category"
                placeholder="Admissions / Fees / Placements"
                value="General"
            >

            <button type="submit">Add FAQ</button>
        </form>
    </section>

    <!-- MANAGE EXISTING FAQs -->
    <section class="card">
        <h2>Manage Existing FAQs</h2>

        <p>Total FAQs: {{ faqs|length }}</p>

        <!-- SEARCH AND CATEGORY FILTER -->
        <div class="filter-section">

            <input
                type="text"
                id="faqSearch"
                placeholder="Search by question, answer or category..."
                aria-label="Search FAQs"
            >

            <select id="categoryFilter" aria-label="Filter by category">
                <option value="">All Categories</option>

                {% for category in faqs|map(attribute='category')|unique|list %}
                    <option value="{{ category|lower }}">
                        {{ category }}
                    </option>
                {% endfor %}
            </select>

        </div>

        <!-- FAQ LIST -->
        {% for faq in faqs %}

        <div
            class="faq"
            data-search="{{ (faq.question ~ ' ' ~ faq.answer ~ ' ' ~ faq.category)|lower }}"
            data-category="{{ faq.category|lower }}"
        >

            <form
                method="POST"
                action="{{ url_for('admin_update', faq_id=faq.id) }}"
            >

                <label>Question</label>
                <input
                    type="text"
                    name="question"
                    value="{{ faq.question }}"
                    required
                >

                <label>Answer</label>
                <textarea name="answer" required>{{ faq.answer }}</textarea>

                <label>Category</label>
                <input
                    type="text"
                    name="category"
                    value="{{ faq.category }}"
                >

                <button type="submit">Save Changes</button>

            </form>

            <form
                method="POST"
                action="{{ url_for('admin_delete', faq_id=faq.id) }}"
                onsubmit="return confirm('Are you sure you want to delete this FAQ?');"
            >

                <button class="delete" type="submit">
                    Delete FAQ
                </button>

            </form>

        </div>

        {% else %}
            <p>No FAQs found in the database.</p>
        {% endfor %}

        <p id="noResults" style="display:none;">
            No matching FAQs found.
        </p>

    </section>

</div>

<!-- FAQ SEARCH AND FILTER JAVASCRIPT -->
<script>
    const searchInput = document.getElementById("faqSearch");
    const categoryFilter = document.getElementById("categoryFilter");
    const faqItems = document.querySelectorAll(".faq");
    const noResults = document.getElementById("noResults");

    function filterFAQs() {

        const searchText = searchInput.value.toLowerCase().trim();
        const selectedCategory = categoryFilter.value.toLowerCase();

        let visibleCount = 0;

        faqItems.forEach(function (faq) {

            const searchContent = faq.dataset.search || "";
            const faqCategory = faq.dataset.category || "";

            const matchesSearch = searchContent.includes(searchText);

            const matchesCategory =
                selectedCategory === "" ||
                faqCategory === selectedCategory;

            if (matchesSearch && matchesCategory) {
                faq.style.display = "";
                visibleCount++;
            } else {
                faq.style.display = "none";
            }

        });

        noResults.style.display =
            visibleCount === 0 ? "block" : "none";
    }

    searchInput.addEventListener("input", filterFAQs);

    categoryFilter.addEventListener("change", filterFAQs);
</script>

</body>
</html>
